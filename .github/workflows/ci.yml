name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcriptFree-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m py_compile app.py run.py run_public.py constants.py render_frontend.py scripts/prepare_vercel.py
      - name: Vercel build smoke (repo root path)
        working-directory: .
        run: python transcriptFree-main/scripts/prepare_vercel.py
        env:
          TRANSCRIPTOR_API_URL: https://example.com
      - name: Run tests
        run: python -m pytest
